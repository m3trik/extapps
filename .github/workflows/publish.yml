name: Publish to PyPI

# extapps is a main-only standalone (no dev/main flow). Publishes on
# every push to main that touches package source or pyproject.toml,
# but only uploads to PyPI when the local __version__ outpaces what's
# already on PyPI. Mirrors the ecosystem publish pattern minus the
# dev-bump step.

on:
  push:
    branches: [main]
    paths:
      - 'extapps/**'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Skip Upload)'
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build twine

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP '__version__\s*=\s*["\x27]\K[^"\x27]+' extapps/__init__.py)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          PYPI=$(pip index versions extapps 2>/dev/null | grep -oP 'Available versions: \K[^,]+' || echo "none")
          echo "pypi=$PYPI" >> $GITHUB_OUTPUT

          if [ "$VERSION" != "$PYPI" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: |
          python -m build --wheel
          python -m twine check dist/*

      - name: Verify Install
        if: steps.version.outputs.publish == 'true'
        run: pip install dist/*.whl --no-deps

      - name: Publish
        if: steps.version.outputs.publish == 'true' && inputs.dry_run != true
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload dist/* --skip-existing

      - name: Summary
        run: |
          if [ "${{ steps.version.outputs.publish }}" == "true" ]; then
            echo "Published extapps v${{ steps.version.outputs.version }}"
          else
            echo "v${{ steps.version.outputs.version }} already on PyPI"
          fi
