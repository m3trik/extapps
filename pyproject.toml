[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extapps"
dynamic = ["version", "readme"]
description = "Standalone Qt tools for content pipelines: texture map compositing and conversion, photogrammetry, Substance Painter automation and mesh conversion."
keywords = ["m3trik", "photogrammetry", "pbr", "substance-painter", "gltf", "technical-art", "pyside6"]
authors = [{name = "Ryan Simpson", email = "m3trik@outlook.com"}]
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Graphics",
]

# Floors are HAND-RATCHETED here: extapps is off-chain from m3trik/push.ps1
# (absent from $STRICT_PACKAGES and $REQUIRED_PINS), so nothing bumps these
# for us the way it does for the cascade packages.
# pythontk 0.9.33 / uitk 1.3.96: the Map Packer's output-affix field reads the
# shared convention (ptk.NamingConvention.affix), normalises a bare token with
# ptk.StrUtils.delimit_affix, and drives the picker through the option box's
# set_affix(convention_key=, settings_key=) -- all four first ship in those
# releases. The floor matters on an UPGRADE, not a fresh install: pip leaves an
# already-satisfied floor alone, so an artist on pythontk 0.9.32 would keep it
# and the packer would die on the first pack. (Supersedes the 0.9.25 floor the
# Map Converter's 'Clamp: Target' needed for MapOptimizer's long-edge snap.)
# pythontk 0.11.1: the Map Converter's Optimize RDO / RDO Dictionary rows hand
# MapOptimizer.optimize_map / assess the uastc_rdo pair, which first ships
# there (an older pythontk raises TypeError on the first optimize).
# uitk 1.4.2: both KTX2 panels hand `Switchboard.confirm` to the install
# offer (`ptk.ImgUtils.settle_ktx2_encoder(prompt=sb.confirm)`); an older uitk
# has no `confirm` and the first KTX2 run raises AttributeError.
# pythontk 0.11.3: the WebXR Preview's Share Via row lists
# `ptk.ShareTunnel.PROVIDERS` at import and Share Link calls
# `PreviewBridge.share`; an older pythontk has neither, so the panel raises
# AttributeError on load.
# pythontk 0.11.4: the Sharing row hands `PreviewBridge.share(on_step=)` and
# catches `ShareTunnel.StepRequired`, and the Viewer rows set the deliverer's
# `user_pos` / `locomotion`; an older pythontk raises TypeError on the first
# share and AttributeError while handling it.
# uitk 1.5.2: the Sharing row is `AttributeSpec(preset=False)`, which keeps it
# out of presets and Reset to Defaults; an older uitk raises TypeError on
# import of the WebXR Preview's parameters.
# uitk 1.6.0: the shared panel launcher registers extapps' Preset Editor label
# (`uitk.PresetEditor.register_app_label`) and six panels' parameters.py
# subclass `uitk.bridge.ParamRegistry`; an older uitk has neither, so every
# panel raises ImportError on build.
# pythontk 0.12.0: the Compositor imports `ptk.TooltipFormat` (ImportError on
# load); the RealityScan and SuGaR runs write their scripts through
# `AppLauncher.write_batch_script`, the Map Converter's rename-mode Optimize
# moves through `FileUtils.replace_file` and the Mesh Converter's install offer
# reads `MeshConvert.FBX2GLTF_VERSION` (each AttributeError on first use). An
# older `AppInstaller` also ignores Brush's `arch` pin, so an arm64 Linux
# downloads an x86_64 binary, and an older `scan_install_dirs` leaves the
# Metashape finder's `~/...` patterns unexpanded, so it finds nothing there.
# pythontk 0.13.0: the WebXR Preview's Copy Scene Link reads
# `PreviewServer.scene_url` and `share_info()["scene_url"]` (the published
# scene as data, `GET /scene.json`); an older pythontk raises AttributeError
# (not shared) or KeyError (shared) on the first copy.
# uitk 1.7.0: the Viewer Scripts list keeps its ticked scripts across sessions
# (`check_list`'s `state_signal` / `state_value`); an older uitk keys a
# QListWidget on `itemClicked`, so the list comes back at its default.
# uitk 1.7.1 / pythontk 0.13.1: `python -m extapps` (and the `extapps`
# command) is a `uitk.ExternalAppHub`, whose desktop shortcuts are written by
# `ptk.AppLauncher.create_shortcut` from `windowless_python`; an older uitk
# has no ExternalAppHub (ImportError on `python -m extapps`), an older
# pythontk neither shortcut member (AttributeError on the first shortcut).
# The same releases carry the WebXR Preview's Source Files row (uitk's
# `files` kind: an older uitk raises KeyError building the panel) and its
# Private Link / Test Link (`PreviewBridge.share(private=)` / `ping_share`:
# TypeError / AttributeError on the first share), and most of the OpenPBR
# lobe map types the Map Packer's new channel combos name.
# pythontk 0.15.0: the photogrammetry profile's scratch root reads
# UserConfig.cache_dir and the Map Converter's rename scratch is
# TempArtifacts.scoped -- both first ship there (an older pythontk raises
# AttributeError on profile load and on every rename).
# pythontk 0.16.0 / uitk 1.7.5: Look Match stands on pythontk's look-match
# engine (LookMatch, LookCapture, LookSession, JobQueue, LightRigPayload) and
# uitk's ImageView / CompareView / ValueBarDelegate / BackgroundTask -- and
# WebXR Preview imports BackgroundTask at module load (ImportError on an older
# uitk) and its log's [copy] links need the log pane's action://copy; the
# vendored Marmoset engine asks AppLauncher.can_hide / run(hidden=)
# (AttributeError / TypeError on an older pythontk). pythontk 0.16.1: a GLB
# pushed with KTX2 left picked asks for no encoder (0.16.0's preflight
# demanded toktx and failed the push without it).
dependencies = ["pythontk>=0.16.1", "uitk>=1.7.5", "qtpy"]

# unitytk is OPTIONAL: it backs only the Unity Workflow panel, for users who
# take exports into Unity and want to extend what ships here. The panel is
# runtime-discovered like every other extapps app, so a missing unitytk costs
# that one panel and nothing else.
# Install with the extra when you want it:  pip install extapps[unity]
# unitytk 0.1.0: its templates moved into one folder per component; an older
# deployer knows only the flat names, so its Install / Update writes flat
# copies beside the moved ones -- every class twice, and the Unity assembly
# fails to compile (CS0101).
#
# mesh pulls pythontk's PyMeshLab extra: it backs only the photogrammetry
# mesh stages (measure / refine / bake via pythontk.MeshOps). Without it the
# stages record an honest skip in the QC sidecar and everything else runs.
# Install with the extra when you want it:  pip install extapps[mesh]
[project.optional-dependencies]
unity = ["unitytk>=0.1.0"]
mesh = ["pythontk[mesh]"]

[project.urls]
Homepage = "https://github.com/m3trik/extapps"
Repository = "https://github.com/m3trik/extapps"
Changelog = "https://github.com/m3trik/extapps/blob/main/CHANGELOG.md"
Issues = "https://github.com/m3trik/extapps/issues"

# `extapps` opens the panel browser, `extapps <panel>` one panel (the names in
# the entry-point table below). A gui-script runs under pythonw on Windows, so
# no console window opens. The hub is uitk's ExternalAppHub, declared in
# extapps/__main__.py (`python -m extapps` runs the same program).
[project.gui-scripts]
extapps = "extapps.__main__:HUB.run"

# Each app self-describes as a uitk external app. uitk's
# ExternalAppHandler discovers and registers them with hosts (tentacle,
# mayatk, etc.) — no host-side knowledge required. Group ``.in_process``
# declares the preferred launch mode (parented under the host's Qt loop).
#
# Bracketed extras are entry-point tags read by ExternalAppHandler:
#   * plain tokens  -> semantic browser-filter tags.
#   * ``hide_<host>`` -> a host-visibility gate. A host whose switchboard
#     ``context_tags`` contains <host> won't *list* the app (it stays
#     launchable by name). Substance/Marmoset are gated out of Maya, which
#     ships native bridges (mayatk.mat_utils) and surfaces those instead.
[project.entry-points."uitk.external_apps.in_process"]
compositor = "extapps.texture_maps.compositor:CompositorUI"
metashape_workflow = "extapps.photogrammetry.metashape_workflow:MetashapeWorkflowUI"
realityscan_workflow = "extapps.photogrammetry.realityscan_workflow:RealityScanWorkflowUI"
gaussian_splat_workflow = "extapps.photogrammetry.gaussian_splat_workflow:GaussianSplatWorkflowUI"
substance_workflow = "extapps.substance_workflow:SubstanceWorkflowUI [hide_maya]"
converter = "extapps.texture_maps.converter:ConverterUI"
packer = "extapps.texture_maps.packer:PackerUI"
mesh_convert = "extapps.mesh_convert:MeshConvertUI"
marmoset_workflow = "extapps.marmoset_workflow:MarmosetWorkflowUI [hide_maya]"
unity_workflow = "extapps.unity_workflow:UnityWorkflowUI"
webxr_preview = "extapps.webxr_preview:WebXrPreviewUI"
look_match = "extapps.look_match:LookMatchUI"

[tool.setuptools.dynamic]
version = {attr = "extapps.__version__"}
readme = {file = "docs/README.md", content-type = "text/markdown"}

[tool.setuptools.packages.find]
where = ["."]
include = ["extapps*"]

[tool.setuptools.package-data]
"*" = ["*.ui", "*.json", "*.txt", "*.md", "*.html", "*.svg"]
# Built-in run-template presets ship in a plain data subdir (not a package), so
# the top-level "*" json glob (package-dir only) doesn't reach them. They live in
# per-engine subdirs (presets/<engine>/*.json) — presets are engine-scoped.
"extapps.photogrammetry" = ["presets/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = [".", "test"]
addopts = "--ignore=test/temp_tests"

[tool.ruff]
# House formatter/linter - rule set, exemptions and gate status: m3trik/docs/CODE_STANDARD.md section 1.
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]  # house pattern: try-guarded DCC imports precede the other imports

[tool.ruff.lint.per-file-ignores]
"**/templates/**" = ["F821"]  # exec-templates carry __PLACEHOLDER__ tokens substituted at run time
