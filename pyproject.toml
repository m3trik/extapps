[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extapps"
dynamic = ["version", "readme"]
description = "Standalone Switchboard panels for content-pipeline workflows (map compositing, photogrammetry, Substance Painter automation, texture conversion, mesh conversion)."
authors = [{name = "Ryan Simpson", email = "m3trik@outlook.com"}]
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = ["pythontk>=0.9.20", "uitk>=1.3.79", "qtpy"]

# unitytk is OPTIONAL: it backs only the Unity Workflow panel, for users who
# take exports into Unity and want to extend what ships here. The panel is
# runtime-discovered like every other extapps app, so a missing unitytk costs
# that one panel and nothing else.
# Install with the extra when you want it:  pip install extapps[unity]
#
# mesh pulls pythontk's PyMeshLab extra: it backs only the photogrammetry
# mesh stages (measure / refine / bake via pythontk.MeshOps). Without it the
# stages record an honest skip in the QC sidecar and everything else runs.
# Install with the extra when you want it:  pip install extapps[mesh]
[project.optional-dependencies]
unity = ["unitytk>=0.0.8"]
mesh = ["pythontk[mesh]"]

[project.urls]
Homepage = "https://github.com/m3trik/extapps"
Repository = "https://github.com/m3trik/extapps"

# Each app self-describes as a uitk external app. uitk's
# ExternalAppHandler discovers and registers them with hosts (tentacle,
# mayatk, etc.) — no host-side knowledge required. Group ``.in_process``
# declares the preferred launch mode (parented under the host's Qt loop).
#
# Bracketed extras are entry-point tags read by ExternalAppHandler:
#   * plain tokens  -> semantic browser-filter tags.
#   * ``hide_<host>`` -> a host-visibility gate. A host whose switchboard
#     ``context_tags`` contains <host> won't *list* the app (it stays
#     launchable by name). Substance/Marmoset are gated out of Maya, which
#     ships native bridges (mayatk.mat_utils) and surfaces those instead.
[project.entry-points."uitk.external_apps.in_process"]
compositor = "extapps.texture_maps.compositor:CompositorUI"
metashape_workflow = "extapps.photogrammetry.metashape_workflow:MetashapeWorkflowUI"
realityscan_workflow = "extapps.photogrammetry.realityscan_workflow:RealityScanWorkflowUI"
gaussian_splat_workflow = "extapps.photogrammetry.gaussian_splat_workflow:GaussianSplatWorkflowUI"
substance_workflow = "extapps.substance_workflow:SubstanceWorkflowUI [hide_maya]"
converter = "extapps.texture_maps.converter:ConverterUI"
packer = "extapps.texture_maps.packer:PackerUI"
mesh_convert = "extapps.mesh_convert:MeshConvertUI"
marmoset_workflow = "extapps.marmoset_workflow:MarmosetWorkflowUI [hide_maya]"
unity_workflow = "extapps.unity_workflow:UnityWorkflowUI"

[tool.setuptools.dynamic]
version = {attr = "extapps.__version__"}
readme = {file = "docs/README.md", content-type = "text/markdown"}

[tool.setuptools.packages.find]
where = ["."]
include = ["extapps*"]

[tool.setuptools.package-data]
"*" = ["*.ui", "*.json", "*.txt", "*.md", "*.html"]
# Built-in run-template presets ship in a plain data subdir (not a package), so
# the top-level "*" json glob (package-dir only) doesn't reach them. They live in
# per-engine subdirs (presets/<engine>/*.json) — presets are engine-scoped.
"extapps.photogrammetry" = ["presets/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = [".", "test"]
addopts = "--ignore=test/temp_tests"

[tool.ruff]
# House formatter/linter - rule set, exemptions and gate status: m3trik/docs/CODE_STANDARD.md section 1.
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]  # house pattern: try-guarded DCC imports precede the other imports

[tool.ruff.lint.per-file-ignores]
"**/templates/**" = ["F821"]  # exec-templates carry __PLACEHOLDER__ tokens substituted at run time
